# ============================================================================
# DOCKER COMPOSE - CLYVO VET PLATFORM (EXECUÇÃO LOCAL)
# Aplicação Non-Root + Oracle Database Free em rede isolada com volume persistente.
# Nenhuma senha fica no arquivo: DB_PASS, JWT_SECRET e DEMO_PASSWORD são obrigatórios.
#   export DB_PASS="..." JWT_SECRET="$(openssl rand -base64 48)" DEMO_PASSWORD="..."
#   docker compose up --build
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. SERVIÇO: BANCO DE DADOS (Oracle Database Free 23ai)
  # --------------------------------------------------------------------------
  clyvovet-db:
    image: gvenzl/oracle-free:23-slim
    container_name: clyvovet-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${DB_PASS:?Defina DB_PASS}
      APP_USER: ${DB_USER:-clyvovet}
      APP_USER_PASSWORD: ${DB_PASS:?Defina DB_PASS}
    ports:
      - "1521:1521"
    volumes:
      - clyvovet_db_data:/opt/oracle/oradata
    networks:
      - clyvo-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # --------------------------------------------------------------------------
  # 2. SERVIÇO: APLICAÇÃO SPRING BOOT 3 (Java 21 LTS - Non-Root)
  # O Flyway cria o schema (V1..V6) e o perfil demo carrega os dados de exemplo.
  # --------------------------------------------------------------------------
  clyvovet-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clyvovet-api:latest
    container_name: clyvovet-app
    restart: unless-stopped
    depends_on:
      clyvovet-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,demo
      DB_URL: jdbc:oracle:thin:@clyvovet-db:1521/FREEPDB1
      DB_USER: ${DB_USER:-clyvovet}
      DB_PASS: ${DB_PASS:?Defina DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Defina DEMO_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - clyvo-network

volumes:
  clyvovet_db_data:
    name: clyvovet_db_data

networks:
  clyvo-network:
    name: clyvo-network
    driver: bridge
